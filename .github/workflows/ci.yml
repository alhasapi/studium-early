name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Unit, integration and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 gettext
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
          lua -v
          luac -v

      - name: Run regression checks
        run: ./tests/run.sh

      - name: Check translation templates are current
        run: |
          ./tools/update-locale.sh
          git diff --exit-code -- 'mods/*/locale'

  live-smoke:
    name: Live Luanti startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luanti
        run: |
          sudo apt-get update
          # Ubuntu ships the engine but, as of noble, no game package, so try the
          # engine names that exist and fail loudly if none of them installed.
          sudo apt-get install -y --no-install-recommends minetest \
            || sudo apt-get install -y --no-install-recommends minetest-server \
            || true
          export PATH="$PATH:/usr/games"
          if ! command -v luanti && ! command -v minetest && ! command -v minetestserver; then
            echo "::error::No Luanti engine package is available on this runner."
            apt-cache policy minetest minetest-server luanti || true
            exit 1
          fi

      - name: Install Minetest Game
        run: |
          # No distribution package supplies a game here, so fetch one. It has to
          # match the engine: a newer Minetest Game refuses to load on an older
          # engine, which is what the runner's package provides.
          export PATH="$PATH:/usr/games"
          ENGINE=""
          for candidate in luanti minetest minetestserver; do
            if command -v "$candidate" >/dev/null 2>&1; then
              ENGINE="$(command -v "$candidate")"
              break
            fi
          done
          VERSION="$("$ENGINE" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          echo "engine: $ENGINE version: $VERSION"
          GAME=https://github.com/luanti-org/minetest_game
          mkdir -p "$HOME/.minetest/games"
          if [ -n "$VERSION" ] && git ls-remote --tags "$GAME" "refs/tags/$VERSION" | grep -q .; then
            git clone --depth 1 --branch "$VERSION" "$GAME" "$HOME/.minetest/games/minetest_game"
          else
            git clone --depth 1 "$GAME" "$HOME/.minetest/games/minetest_game"
          fi
          ls "$HOME/.minetest/games"

      - name: Run live smoke test
        env:
          STUDIUM_REQUIRE_LUANTI: "1"
        run: ./tests/live_smoke.sh

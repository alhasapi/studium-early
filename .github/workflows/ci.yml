name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Unit, integration and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.1)" /usr/local/bin/luac
          lua -v
          luac -v

      - name: Run regression checks
        run: ./tests/run.sh

  live-smoke:
    name: Live Luanti startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luanti
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minetest minetest-game \
            || sudo apt-get install -y --no-install-recommends luanti || true
          # Fail here, with a clear message, rather than letting the smoke test
          # skip and report a green run that tested nothing.
          command -v luanti || command -v minetest || {
            echo "No Luanti server package is available on this runner." >&2
            exit 1
          }

      - name: Run live smoke test
        env:
          STUDIUM_REQUIRE_LUANTI: "1"
        run: ./tests/live_smoke.sh
